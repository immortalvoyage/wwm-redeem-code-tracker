name: Temporary TWSE Priority Universe Fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/twse-priority-universe-fetch.yml'
      - 'scripts/twse_priority_universe_fetch.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bounded fetcher
        run: python -m py_compile scripts/twse_priority_universe_fetch.py
      - name: Fetch official TWSE priority universe raw data
        run: python scripts/twse_priority_universe_fetch.py
      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: twse-priority-universe-2023-2025
          path: twse_priority_universe_output/
          if-no-files-found: error
          retention-days: 7
