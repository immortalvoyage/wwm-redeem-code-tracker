name: Temporary TWSE FMTQIK Public Fetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/twse-fmtqik-public-fetch.yml'
      - 'scripts/twse_fmtqik_public_fetch.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/twse-fmtqik-public-fetch.yml'
      - 'scripts/twse_fmtqik_public_fetch.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/twse_fmtqik_public_fetch.py
      - name: Fetch bounded public TWSE data
        run: python scripts/twse_fmtqik_public_fetch.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twse-fmtqik-2023-2025
          path: twse_fmtqik_output/
          if-no-files-found: error
          retention-days: 7
